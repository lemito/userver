openapi: 3.0.0
info:
    title: bearer-auth client
    version: '1.0'

components:
    securitySchemes:
        myBearerScheme:
            type: http
            scheme: bearer
            bearerFormat: JWT
        adminBearerScheme:
            type: http
            scheme: bearer

paths:
    /api/resource:
        get:
            operationId: GetResource
            security:
              - myBearerScheme: []
            responses:
                '200':
                    description: OK
    /api/admin:
        get:
            operationId: GetAdmin
            security:
              - adminBearerScheme: []
            responses:
                '200':
                    description: OK