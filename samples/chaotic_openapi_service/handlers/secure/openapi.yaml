openapi: 3.0.0
info:
    title: Secure handler
    version: '1.0'
paths:
    /secure/greeting:
        get:
            operationId: greetingGet
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GreetingResponse'
    /secure/bearer:
        get:
            operationId: BearerGet
            security:
              - myBearerScheme: []
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GreetingResponse'
    /secure/secret:
        get:
            operationId: SecretGet
            security:
              - myDigestScheme: []
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GreetingResponse'
components:
    securitySchemes:
        myDigestScheme:
            type: http
            scheme: digest
        myBearerScheme:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        GreetingResponse:
            type: object
            additionalProperties: false
            required:
              - greeting
            properties:
                greeting:
                    type: string
